# Configuration file

general {
    # Allow URLClassLoader casts followed by getURLs() to work on loaders that are no longer URLClassLoaders.
    B:classLoaderUrls=true

    # getCodeSource().getLocation().toURI() yields the jar file for classes loaded from a jar.
    B:codeSourceUri=true

    # HashMap.computeIfAbsent tolerates mapping functions that modify the map, as Java 8 did.
    B:computeIfAbsent=true

    # Redirect old Futures.addCallback overload that newer Guava removed.
    B:futuresAddCallback=true

    # Redirect removed javax (Java EE) packages to their new jakarta replacements.
    B:jakarta=true

    # Reflection on LaunchClassLoader fields resolves against Foundation's classloader.
    B:launchClassLoaderFields=true

    # UUID::fromString accepts malformed UUIDs that Java 8 accepted.
    B:malformedUuid=true

    # Redirect oshi.SystemInfo to the new bundled FFM-based oshi.
    B:oshi=true

    # Allow Field.get/set calls to work again when they hit final/inaccessible fields.
    B:reflectFields=true

    # new ScriptEngineManager() returns a manager that knows the bundled Nashorn.
    B:scriptEngine=true

    # Redirect removed internal sun.reflect.Reflection class to a mocked class.
    B:sunReflection=true

    # (X[]) collection.toArray() becomes collection.toArray(new X[0]).
    B:toArrayCast=true
}


