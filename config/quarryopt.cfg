# Configuration file

general {
    # Half-width of the chunk area wiped when a Quantum Quarry finishes a chunk. 1 = 3x3 (9 chunks, everything that can actually have been modified). 2 = 5x5 (25 chunks, Extra Utilities 2's original behaviour). Automatically forced to 2 while the Extra Utilities 2 option 'Quantum Quarry: Enable Nether/End biome generation' is on, because those jobs write blocks across the full 5x5. [range: 1 ~ 2, default: 1]
    I:chunkResetRadius=1

    # Skip building throwaway EntityItems for drops that Extra Utilities 2 is about to capture anyway. [default: true]
    B:dropCapture=true

    # Cache deserialized Extra Utilities 2 filter contents instead of rebuilding them from NBT on every check. [default: true]
    B:filterCache=true

    # Cache a whole filter at once (all 16 slots plus its flags) rather than slot by slot. Set false to fall back to the simpler per-slot cache. Needs filterCache on. [default: true]
    B:filterFullCache=true
}


